name: Feature request
description: Suggest something the app should show or do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution — it helps us find the right shape.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
