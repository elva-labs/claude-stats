name: Release

# Two ways in:
#   - push a tag `v1.2.0`
#   - run the workflow manually with a version, which creates that tag for you
#
# Signing and notarization activate automatically once the repository has the
# secrets below; without them the release ships ad-hoc signed and the release
# notes tell users how to open it past Gatekeeper.
#
#   MACOS_CERTIFICATE           base64 of a Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  password for that .p12
#   MACOS_SIGN_IDENTITY         e.g. "Developer ID Application: Elva Labs (TEAMID)"
#   NOTARY_KEY                  base64 of an App Store Connect API .p8 key
#   NOTARY_KEY_ID               its key id
#   NOTARY_ISSUER_ID            its issuer id
#   TAP_GITHUB_TOKEN            token with write access to elva-labs/homebrew-elva;
#                               without it the cask update step is skipped

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.0, without the v)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    if: github.repository == 'elva-labs/claude-stats'
    env:
      HAVE_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAVE_NOTARY: ${{ secrets.NOTARY_KEY != '' }}
      HAVE_TAP: ${{ secrets.TAP_GITHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        if: env.HAVE_CERT == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=release.keychain-db
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT" | base64 -d > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm cert.p12
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Build
        env:
          SIGN_IDENTITY: ${{ env.HAVE_CERT == 'true' && secrets.MACOS_SIGN_IDENTITY || '-' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}" SKIP_INSTALL=1 ./build.sh

      - name: Notarize and staple
        if: env.HAVE_CERT == 'true' && env.HAVE_NOTARY == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY" | base64 -d > notary.p8
          ditto -c -k --keepParent "dist/Claude Stats.app" notarize.zip
          xcrun notarytool submit notarize.zip \
            --key notary.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait
          rm notary.p8 notarize.zip
          xcrun stapler staple "dist/Claude Stats.app"

      - name: Package
        run: ditto -c -k --keepParent "dist/Claude Stats.app" "Claude-Stats.zip"

      - name: Create tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "elva-bot"
          git config user.email "gh-bot@elva-group.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=""
          if [[ "$HAVE_CERT" != "true" ]]; then
            NOTES=$'\n> [!NOTE]\n> This build is not yet notarized, so macOS will refuse to open it at first. Either run `xattr -dr com.apple.quarantine "/Applications/Claude Stats.app"` after installing, or open it once, then approve it under **System Settings → Privacy & Security → Open Anyway**.'
          fi
          gh release create "v${{ steps.version.outputs.version }}" "Claude-Stats.zip" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --notes "$NOTES"

      - name: Update Homebrew cask
        if: env.HAVE_TAP == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA="$(shasum -a 256 Claude-Stats.zip | cut -d' ' -f1)"
          gh auth setup-git
          git clone --depth 1 https://github.com/elva-labs/homebrew-elva.git tap
          mkdir -p tap/Casks
          cat > tap/Casks/claude-stats.rb <<CASK
          cask "claude-stats" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/elva-labs/claude-stats/releases/download/v#{version}/Claude-Stats.zip"
            name "Claude Stats"
            desc "Claude and OpenAI usage quotas in the menu bar"
            homepage "https://github.com/elva-labs/claude-stats"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on macos: :sonoma

            app "Claude Stats.app"

            zap trash: [
              "~/Library/Application Support/ClaudeStats",
              "~/Library/Logs/ClaudeStats.log",
              "~/Library/Preferences/com.elva-labs.claude-stats.plist",
            ]
          end
          CASK
          cd tap
          git config user.name "elva-bot"
          git config user.email "gh-bot@elva-group.com"
          git add Casks/claude-stats.rb
          git commit -m "Update claude-stats to v${VERSION}"
          git push
